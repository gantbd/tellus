[workspace]
resolver = "3"
members = ["local-client", "cli"]

[package]
name = "grounding-tui"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
license = "MIT OR Apache-2.0"
publish = false
description = "Composable terminal presentation for Dendrite Grounding observations"

[dependencies]
ratatui = { version = "=0.30.2", default-features = false }
crossterm = "=0.29.0"

[lints.rust]
unsafe_code = "forbid"
[lints.clippy]
all = "warn"

