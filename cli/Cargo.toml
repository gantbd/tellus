[package]
name = "grounding-tui-cli"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
license = "MIT OR Apache-2.0"
publish = false

[[bin]]
name = "grounding-tui"
path = "src/main.rs"
doc = false

[dependencies]
grounding-tui = { path = ".." }
grounding-tui-local-client = { path = "../local-client" }
ratatui = { version = "=0.30.2", default-features = false, features = ["crossterm"] }
crossterm = "=0.29.0"
serde_json = "=1.0.151"

[lints.rust]
unsafe_code = "forbid"
[lints.clippy]
all = "warn"

